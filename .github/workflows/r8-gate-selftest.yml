name: R8 Gate Self-Test

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r8-gate-selftest:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n gates/r8_app_artifact_audit.sh
          bash -n gates/r8_app_artifact_audit_selftest.sh

      - name: Run host-only artifact gate self-test
        shell: bash
        run: |
          set -euo pipefail
          bash gates/r8_app_artifact_audit_selftest.sh
